{% load l10n %}
<div class="card h-100"><div class="card-body p-4">
  <div class="d-flex justify-content-between align-items-start">
    <div><h5 class="fw-bold mb-0">{{ b.name }}</h5><div class="small text-muted">{{ b.sub }}</div></div>
    <span class="pill tone-{{ b.stage_tone }}">{{ b.stage }}</span>
  </div>
  <div class="mt-3"><span class="fs-3 fw-bold">{{ b.big }}</span> <span class="text-muted">{{ b.big_label }}</span></div>
  <div class="life-bar"><span class="seg s1"></span><span class="seg s2"></span><span class="seg s3"></span><span class="seg s4"></span><span class="marker" style="left:{{ b.marker|unlocalize }}%"></span></div>
  <div class="life-legend"><span>Brooding</span><span>Rearing</span><span>Laying</span><span>Retire</span></div>
  <div class="d-flex flex-wrap gap-2 my-3">{% for text, tone in b.chips %}<span class="pill tone-{{ tone }}">{{ text }}</span>{% endfor %}</div>
  <div class="small p-3 rounded-3 tone-info"><i class="bi bi-lightbulb me-1"></i>{{ b.next }}</div>
  <a href="{% url b.url_name %}" class="btn btn-outline-primary btn-sm mt-3">Open</a>
</div></div>
