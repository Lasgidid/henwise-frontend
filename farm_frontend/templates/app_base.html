{% extends "base.html" %}
{% block body %}
{% with url_name=request.resolver_match.url_name %}
<div class="app-shell">
  <aside class="sidebar d-none d-lg-flex">
    {% include "partials/_nav.html" %}
  </aside>
  <div class="flex-grow-1 min-w-0" style="min-width:0">
    <div class="topbar-m d-flex d-lg-none align-items-center justify-content-between">
      <a class="brand" href="{% url 'dashboard' %}"><i class="bi bi-egg-fill"></i>{{ brand }}</a>
      <button class="btn btn-outline-primary btn-sm" data-bs-toggle="offcanvas" data-bs-target="#navCanvas"><i class="bi bi-list"></i></button>
    </div>
    <main class="app-main">{% block content %}{% endblock %}</main>
  </div>
</div>
<div class="offcanvas offcanvas-start" id="navCanvas" tabindex="-1" style="width:260px">
  <div class="offcanvas-body d-flex flex-column">{% include "partials/_nav.html" %}</div>
</div>
{% endwith %}
{% endblock %}
